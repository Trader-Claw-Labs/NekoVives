[package]
name = "micro-recorder"
version = "0.1.0"
edition = "2021"
publish = false
description = "High-frequency BTC market-microstructure recorder (OBI/OFI/CVD/liquidations + Chainlink RTDS + Polymarket CLOB book)"

[[bin]]
name = "micro-recorder"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
parking_lot = "0.12"
